server {
    listen 80 default_server;
    server_name _;

    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location /report {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
    }
}
