name: no-connection
author: TCP1P contributors
description: |-
  Can you connect to MongoDB and recover the flag through the restricted curl service?

  Start an instance, connect to its exposed TCP service, and follow the original FTP passive-mode redirection concept.

  ---
  Historical challenge converted from [INTECHFEST CTF 2023](https://github.com/TCP1P/INTECHFEST-CTF-2023-Challenges/tree/main/misc/no-connection).
type: DynamicContainer
category: Misc
minScoreRate: 0.01
difficulty: 5
disableBloodBonus: true
flagTemplate: INTECHFEST{no_connection_[TEAM_HASH]}
container:
  memoryLimit: 384
  cpuCount: 1
  exposePort: 8080
  enableTrafficCapture: false
